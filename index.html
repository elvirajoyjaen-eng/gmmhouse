    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cinzel for luxury serif branding, Inter for UI, JetBrains Mono for codes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-obsidian: #0B0B0D;
            --gold-antique: #D9A05B;
            --gold-warm: #E8B878;
            --gold-champagne: #EED69C;
            --ivory-medallion: #F5F2EB;
            --plum-strip: #3D1B35;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #09080A;
            color: #F4F4F5;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Cozy Warm Cafe Ambient Background */
        .cafe-ambient-bg {
            background:
                radial-gradient(circle at 18% 12%, rgba(217, 160, 91, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 85% 18%, rgba(61, 27, 53, 0.5) 0%, transparent 52%),
                radial-gradient(circle at 50% 92%, rgba(120, 68, 28, 0.2) 0%, transparent 55%),
                linear-gradient(180deg, #110E0D 0%, #09080A 100%);
        }

        .font-serif-luxury {
            font-family: 'Cinzel', serif;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Antique Brushed Gold / Rose-Gold Foil Gradients (Matching Reference Images) */
        .text-gold-metallic {
            background: linear-gradient(135deg, #F6DFB0 0%, #E8B878 46%, #C48942 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-gold-metallic {
            background: linear-gradient(135deg, #F3D5A5 0%, #E2AD67 50%, #C2863E 100%);
        }

        .bg-champagne-banner {
            background: linear-gradient(180deg, #F3DFAD 0%, #EAD090 100%);
        }

        /* Obsidian Matte Black Card Surface */
        .card-brushed-surface {
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.01) 0px,
                    rgba(255, 255, 255, 0.01) 1px,
                    transparent 1px,
                    transparent 3px
                ),
                radial-gradient(circle at 80% 18%, rgba(217, 160, 91, 0.08) 0%, transparent 48%),
                linear-gradient(160deg, #121215 0%, #0B0B0D 60%, #100D11 100%);
            box-shadow:
                0 28px 60px -15px rgba(0, 0, 0, 0.92),
                0 0 0 1px rgba(217, 160, 91, 0.35),
                inset 0 1px 0 rgba(246, 223, 176, 0.2);
        }

        /* Cream / Ivory Medallion Token with Subtle Inner Depth */
        .ivory-medallion {
            background: radial-gradient(circle at 32% 28%, #FFFFFF 0%, #F5F2EB 65%, #E3DDD0 100%);
            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.55),
                inset 0 2px 3px rgba(255, 255, 255, 0.9),
                inset 0 -2px 4px rgba(168, 152, 124, 0.45);
        }

        /* 3D Flippable Card Container */
        .perspective-stage {
            perspective: 1600px;
        }

        .flip-card-inner {
            display: grid;
            grid-template-columns: 1fr;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.32, 0.64, 1);
        }

        .flip-card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .flip-face {
            grid-area: 1 / 1;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-face-back {
            transform: rotateY(180deg);
        }

        /* Stamp Token Interactive Animations */
        .stamp-token {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }

        .stamp-token:active {
            transform: scale(0.9);
        }

        @keyframes stampBounce {
            0% { transform: scale(0.55) rotate(-14deg); }
            65% { transform: scale(1.14) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .stamp-animate {
            animation: stampBounce 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes starPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(217, 160, 91, 0.7)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 16px rgba(232, 184, 120, 1)); transform: scale(1.08); }
        }

        .star-glow-active {
            animation: starPulse 1.8s infinite ease-in-out;
        }

        /* QR Code Custom Styling inside Plum Strip */
        #cardBackQrBox img, #cardBackQrBox canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            border-radius: 4px;
        }

        #posModalQrBox img, #posModalQrBox canvas {
            width: 176px !important;
            height: 176px !important;
            display: block;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
